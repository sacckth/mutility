[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mutility"
version = "0.1.0"
description = "Unix-like shell for FAT volumes through mtools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mutility = "mutility.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mutility = ["starship.toml"]

[tool.uv]
package = true
